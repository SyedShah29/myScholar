    <circle cx="0" cy="0" r="8" fill="#fbbf24" stroke="none"/>
  </g>

  <g stroke="#14503f" stroke-width="1.3">
    <path d="M710 254 L808 212 L902 242 L1000 300"/>
    <path d="M808 212 L852 122"/>
